version: "2"
linters:
  default: none
  enable:
  - govet
  - revive
  # keep the exclusions golangci-lint v1 applied by default
  exclusions:
    presets:
    - comments
    - common-false-positives
    - legacy
    - std-error-handling
formatters:
  enable:
  - gofmt
run:
  # Timeout for analysis, e.g. 30s, 5m.
  timeout: 5m
